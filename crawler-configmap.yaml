apiVersion: apps/v1
kind: Deployment
metadata:
  name: synergychat-api
  labels:
    app: synergychat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synergychat-api
  template:
    metadata:
      labels:
        app: synergychat-api
    spec:
      containers:
      - name: synergychat-api
        image: docker.io/bootdotdev/synergychat-api:latest
        env:

        env:
        - name: CRAWLER_PORT
          value: "8080"
        - name: synergychat-crawler-configmap
          value: "love,hate,joy,sadness,anger,disgust,fear,surprise"
