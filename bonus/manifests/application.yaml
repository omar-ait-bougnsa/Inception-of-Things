apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-argocd-application-bonus
  namespace: argocd
  finalizers: []
spec:
  destination:
    namespace: dev-bonus
    server: https://kubernetes.default.svc
  source:
    path: dev
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/bonus.git
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true

