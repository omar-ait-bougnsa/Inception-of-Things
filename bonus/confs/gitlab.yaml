apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          env:
            - name: GITLAB_ROOT_PASSWORD
              value: "Oel-Moue@2026!"
            - name: GITLAB_OMNIBUS_CONFIG
              value: "external_url 'http://gitlab.gitlab.svc'; prometheus_monitoring['enable'] = false"
          resources:
            limits:
              cpu: "2"
              memory: 5Gi
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 80
            failureThreshold: 120
          volumeMounts:
            - { name: data, mountPath: /etc/gitlab,     subPath: config }
            - { name: data, mountPath: /var/opt/gitlab, subPath: data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - port: 80