apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-argocd-application
  namespace: argocd
  finalizers: []
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  source:
    path: dev
    repoURL: https://github.com/BL4KCY/IoT-42-assignment.git
    targetRevision: HEAD
  sources: []
  project: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true