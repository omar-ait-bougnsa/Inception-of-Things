apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app1-ingress

spec:
  ingressClassName: traefik
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
    # Direct IP requests and unknown hostnames use app1.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
