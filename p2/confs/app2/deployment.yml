apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app2-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: app2-html
          hostPath:
            path: /vagrant/confs/app2
            type: Directory